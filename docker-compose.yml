services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"  # host port from .env — 5432 is already taken locally
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"  # host port from .env — 6379 is already taken locally
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-replica:
    image: redis:7-alpine
    # SYSTEM_DESIGN.md "primary + N replicas" — N=1 here. REDIS_WAIT_REPLICAS
    # is what makes the API's WAIT call actually block on this link existing.
    command: ["redis-server", "--replicaof", "redis", "6379"]
    ports:
      - "${REDIS_REPLICA_PORT}:6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    build:
      context: ./pgbouncer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "6432"]
      interval: 5s
      timeout: 5s
      retries: 10

  order_api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # postgres/redis hostnames stay literal — this is the internal Docker
      # network address, not the host-facing one in .env's own POSTGRES_URL
      # or REDIS_URL (those use localhost + the remapped host ports instead).
      # Routed through pgbouncer, not straight to postgres — see SYSTEM_DESIGN.md
      # "Pooled Postgres connections" on why a per-replica pool alone doesn't scale.
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL}
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS}
      REDIS_WAIT_REPLICAS: ${REDIS_WAIT_REPLICAS}
      REDIS_WAIT_TIMEOUT_MS: ${REDIS_WAIT_TIMEOUT_MS}
      STREAM_INVENTORY_EVENTS: ${STREAM_INVENTORY_EVENTS}
      RATE_LIMIT_CAPACITY: ${RATE_LIMIT_CAPACITY}
      RATE_LIMIT_REFILL_PER_SECOND: ${RATE_LIMIT_REFILL_PER_SECOND}
      RATE_LIMIT_TTL_SECONDS: ${RATE_LIMIT_TTL_SECONDS}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "${ORDER_API_PORT}:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # no migration tool yet — order_api's startup create_all is what
      # actually provisions the schema, so worker/watchdog wait on this.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "order_api.worker"]
    restart: unless-stopped
    # Each replica gets its own uuid consumer name in the shared consumer
    # group; ensure_consumer_group already tolerates the startup BUSYGROUP race.
    deploy:
      replicas: ${WORKER_REPLICAS}
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL}
      STREAM_INVENTORY_EVENTS: ${STREAM_INVENTORY_EVENTS}
      CONSUMER_GROUP_INVENTORY_SYNC: ${CONSUMER_GROUP_INVENTORY_SYNC}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    expose:
      - "${WORKER_METRICS_PORT}"  # N replicas can't share a host port — Prometheus DNS-discovers them
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      order_api:
        condition: service_healthy

  sweeper:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "order_api.sweeper"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL}
      STREAM_INVENTORY_EVENTS: ${STREAM_INVENTORY_EVENTS}
      SWEEP_CLAIM_TTL_SECONDS: ${SWEEP_CLAIM_TTL_SECONDS}
      SWEEPER_METRICS_PORT: ${SWEEPER_METRICS_PORT}
    ports:
      - "${SWEEPER_METRICS_PORT}:${SWEEPER_METRICS_PORT}"
    depends_on:
      redis:
        condition: service_healthy

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "order_api.watchdog"]
    restart: unless-stopped
    environment:
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      POSTGRES_POOL_SIZE: ${POSTGRES_POOL_SIZE}
      POSTGRES_MAX_OVERFLOW: ${POSTGRES_MAX_OVERFLOW}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL}
      WATCHDOG_POLL_INTERVAL_SECONDS: ${WATCHDOG_POLL_INTERVAL_SECONDS}
      WATCHDOG_CONFIRM_PASSES: ${WATCHDOG_CONFIRM_PASSES}
      WATCHDOG_METRICS_PORT: ${WATCHDOG_METRICS_PORT}
    ports:
      - "${WATCHDOG_METRICS_PORT}:${WATCHDOG_METRICS_PORT}"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      order_api:
        condition: service_healthy

  redis_exporter:
    image: oliver006/redis_exporter:v1.63.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "${REDIS_EXPORTER_PORT}:9121"
    depends_on:
      redis:
        condition: service_healthy

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "${POSTGRES_EXPORTER_PORT}:9187"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "${PROMETHEUS_PORT}:9090"
    depends_on:
      order_api:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT}:9093"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT}:16686"  # trace search UI
      - "4317"  # OTLP/gRPC receiver — order_api/worker reach it by service name, no host port needed

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
