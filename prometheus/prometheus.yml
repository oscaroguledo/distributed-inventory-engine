global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: order_api
    static_configs:
      - targets: ["order_api:8000"]

  # N replicas share one service name — DNS SD resolves every A record
  # Docker's embedded DNS returns for "worker", not just the first one.
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101

  - job_name: sweeper
    static_configs:
      - targets: ["sweeper:9102"]

  - job_name: watchdog
    static_configs:
      - targets: ["watchdog:9103"]

  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
